<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documents autonomes — Audoin Sabrié</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f7f5;
            color: #171717;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 1050px;
            margin: auto;
            padding: 0 30px;
        }

        header {
            padding: 30px 0;
            border-bottom: 1px solid #ddd;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 20px;
        }

        nav ul {
            display: flex;
            gap: 28px;
            list-style: none;
            font-size: 14px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            padding: 100px 0 80px;
        }

        .hero p.intro {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(48px, 8vw, 78px);
            line-height: 1;
            letter-spacing: -3px;
            margin-bottom: 30px;
        }

        .hero-description {
            max-width: 680px;
            font-size: 20px;
            color: #555;
        }

        section {
            padding: 80px 0;
            border-top: 1px solid #ddd;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #777;
            margin-bottom: 40px;
        }

        .level-title {
            font-size: 32px;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        .level-description {
            max-width: 700px;
            color: #666;
            font-size: 17px;
            margin-bottom: 35px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .card {
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            padding: 28px;
            background: white;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #999;
        }

        .card-number {
            font-size: 13px;
            color: #888;
            margin-bottom: 25px;
        }

        .card h3 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            margin-bottom: 20px;
        }
